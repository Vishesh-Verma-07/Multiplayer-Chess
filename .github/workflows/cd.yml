name: CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "https-backend/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/vishesh-verma-07/multiplayer-chess

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            args: |
              VITE_HTTPS_BACKEND_URL=https://chess.visheshxdevs.in/api
              VITE_WEBSOCKET_BACKEND_URL=wss://chess.visheshxdevs.in/api/ws
              VITE_ENVI=production
          - service: backend
            args: ""
          - service: https-backend
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }},${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest
          build-args: ${{ matrix.args }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure cluster
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yml
          export KUBECONFIG=kubeconfig.yml
          kubectl config use-context ${{ secrets.KUBE_CONTEXT }}
      - name: Ensure secrets
        run: |
          export KUBECONFIG=kubeconfig.yml
          kubectl -n chessgame create secret generic https-backend-secrets \
            --from-literal=DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --from-literal=AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n chessgame create secret generic backend-secrets \
            --from-literal=AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }} \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply manifests
        run: |
          export KUBECONFIG=kubeconfig.yml
          kubectl apply -f kubernetes/namespace.yml
          kubectl apply -f kubernetes/backend/config.yml
          kubectl apply -f kubernetes/https-backend/config.yml
          kubectl apply -f kubernetes/infra/
          kubectl apply -f kubernetes/backend/
          kubectl apply -f kubernetes/https-backend/
          kubectl apply -f kubernetes/frontend/
          kubectl apply -f kubernetes/ingress.yml
      - name: Rollout status
        run: |
          export KUBECONFIG=kubeconfig.yml
          kubectl -n chessgame rollout status deployment/backend --timeout=300s
          kubectl -n chessgame rollout status deployment/https-backend --timeout=300s
          kubectl -n chessgame rollout status deployment/frontend --timeout=300s