services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./https-backend
    command: npx prisma db push
    environment:
      DATABASE_URL: postgres://chess:chess@db:5432/chess
    depends_on:
      db:
        condition: service_healthy

  https-backend:
    build:
      context: ./https-backend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: "8000"
      DATABASE_URL: postgres://chess:chess@db:5432/chess
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-secret-change-me}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-secret-change-me}
      HTTPS_BACKEND_URL: http://https-backend:8000
    depends_on:
      https-backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_HTTPS_BACKEND_URL: ${VITE_HTTPS_BACKEND_URL:-http://localhost:8000}
        VITE_WEBSOCKET_BACKEND_URL: ${VITE_WEBSOCKET_BACKEND_URL:-ws://localhost:8080/api/ws}
        VITE_ENVI: docker
    ports:
      - "3000:80"
    depends_on:
      - https-backend
      - backend

volumes:
  db_data: